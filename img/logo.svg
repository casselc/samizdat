<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" role="img" aria-label="Samizdat logo">
    <style>
        .dim-0 { stroke: #6366f1; fill: rgba(99, 102, 241, 0.03); } /* Kernel - Indigo */
        .dim-1 { stroke: #10b981; fill: rgba(16, 185, 129, 0.03); } /* Executor - Emerald */
        .dim-2 { stroke: #f59e0b; fill: rgba(245, 158, 11, 0.03); } /* Capabilities - Amber */
        .dim-3 { stroke: #06b6d4; fill: rgba(6, 182, 212, 0.03); }  /* Manifest - Cyan */
        .hyper-edge { stroke-width: 2.5; stroke-linecap: round; opacity: 0.85; }
        .hyper-face { stroke: none; }
    </style>
    <defs>
        <radialGradient id="box-bg" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#18181b"/>
            <stop offset="100%" stop-color="#09090b"/>
        </radialGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="6" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
        <filter id="shadow-black" x="-20%" y="-40%" width="140%" height="180%">
            <feDropShadow dx="0" dy="36" stdDeviation="24" flood-color="#000000" flood-opacity="0.9"/>
        </filter>
        <filter id="shadow-glow" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="0" dy="0" stdDeviation="48" flood-color="#06b6d4" flood-opacity="0.08"/>
        </filter>
        <clipPath id="box-clip">
            <rect x="80" y="80" width="800" height="800" rx="16"/>
        </clipPath>
    </defs>

    <!-- box-shadow: 0 40px 80px -20px rgba(0, 0, 0, 0.9) -->
    <g filter="url(#shadow-black)">
        <rect x="80" y="80" width="800" height="800" rx="16" fill="#000"/>
    </g>
    <!-- box-shadow: 0 0 120px rgba(6, 182, 212, 0.05) -->
    <g filter="url(#shadow-glow)">
        <rect x="80" y="80" width="800" height="800" rx="16" fill="#000"/>
    </g>

    <!-- .canvas-container: radial gradient bg, 1px border, overflow hidden -->
    <g clip-path="url(#box-clip)">
        <rect x="80" y="80" width="800" height="800" rx="16" fill="url(#box-bg)" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>

        <!-- 24 hyper-faces -->
        <g id="faces-group">
                <polygon class="hyper-face dim-0" points="480,100.29 720.21,199.79 819.71,440 579.5,340.5"/>
                <polygon class="hyper-face dim-0" points="239.79,199.79 480,299.29 579.5,539.5 339.29,440"/>
                <polygon class="hyper-face dim-0" points="380.5,340.5 620.71,440 720.21,680.21 480,580.71"/>
                <polygon class="hyper-face dim-0" points="140.29,440 380.5,539.5 480,779.71 239.79,680.21"/>
                <polygon class="hyper-face dim-0" points="480,100.29 720.21,199.79 620.71,440 380.5,340.5"/>
                <polygon class="hyper-face dim-0" points="239.79,199.79 480,299.29 380.5,539.5 140.29,440"/>
                <polygon class="hyper-face dim-0" points="579.5,340.5 819.71,440 720.21,680.21 480,580.71"/>
                <polygon class="hyper-face dim-0" points="339.29,440 579.5,539.5 480,779.71 239.79,680.21"/>
                <polygon class="hyper-face dim-0" points="480,100.29 720.21,199.79 480,299.29 239.79,199.79"/>
                <polygon class="hyper-face dim-0" points="380.5,340.5 620.71,440 380.5,539.5 140.29,440"/>
                <polygon class="hyper-face dim-0" points="579.5,340.5 819.71,440 579.5,539.5 339.29,440"/>
                <polygon class="hyper-face dim-0" points="480,580.71 720.21,680.21 480,779.71 239.79,680.21"/>
                <polygon class="hyper-face dim-1" points="480,100.29 579.5,340.5 480,580.71 380.5,340.5"/>
                <polygon class="hyper-face dim-1" points="239.79,199.79 339.29,440 239.79,680.21 140.29,440"/>
                <polygon class="hyper-face dim-1" points="720.21,199.79 819.71,440 720.21,680.21 620.71,440"/>
                <polygon class="hyper-face dim-1" points="480,299.29 579.5,539.5 480,779.71 380.5,539.5"/>
                <polygon class="hyper-face dim-1" points="480,100.29 579.5,340.5 339.29,440 239.79,199.79"/>
                <polygon class="hyper-face dim-1" points="380.5,340.5 480,580.71 239.79,680.21 140.29,440"/>
                <polygon class="hyper-face dim-1" points="720.21,199.79 819.71,440 579.5,539.5 480,299.29"/>
                <polygon class="hyper-face dim-1" points="620.71,440 720.21,680.21 480,779.71 380.5,539.5"/>
                <polygon class="hyper-face dim-2" points="480,100.29 380.5,340.5 140.29,440 239.79,199.79"/>
                <polygon class="hyper-face dim-2" points="579.5,340.5 480,580.71 239.79,680.21 339.29,440"/>
                <polygon class="hyper-face dim-2" points="720.21,199.79 620.71,440 380.5,539.5 480,299.29"/>
                <polygon class="hyper-face dim-2" points="819.71,440 720.21,680.21 480,779.71 579.5,539.5"/>
        </g>

        <!-- 32 hyper-edges -->
        <g id="edges-group" filter="url(#glow)">
                <line class="hyper-edge dim-0" x1="480" y1="100.29" x2="720.21" y2="199.79"/>
                <line class="hyper-edge dim-1" x1="480" y1="100.29" x2="579.5" y2="340.5"/>
                <line class="hyper-edge dim-2" x1="480" y1="100.29" x2="380.5" y2="340.5"/>
                <line class="hyper-edge dim-3" x1="480" y1="100.29" x2="239.79" y2="199.79"/>
                <line class="hyper-edge dim-1" x1="720.21" y1="199.79" x2="819.71" y2="440"/>
                <line class="hyper-edge dim-2" x1="720.21" y1="199.79" x2="620.71" y2="440"/>
                <line class="hyper-edge dim-3" x1="720.21" y1="199.79" x2="480" y2="299.29"/>
                <line class="hyper-edge dim-0" x1="579.5" y1="340.5" x2="819.71" y2="440"/>
                <line class="hyper-edge dim-2" x1="579.5" y1="340.5" x2="480" y2="580.71"/>
                <line class="hyper-edge dim-3" x1="579.5" y1="340.5" x2="339.29" y2="440"/>
                <line class="hyper-edge dim-2" x1="819.71" y1="440" x2="720.21" y2="680.21"/>
                <line class="hyper-edge dim-3" x1="819.71" y1="440" x2="579.5" y2="539.5"/>
                <line class="hyper-edge dim-0" x1="380.5" y1="340.5" x2="620.71" y2="440"/>
                <line class="hyper-edge dim-1" x1="380.5" y1="340.5" x2="480" y2="580.71"/>
                <line class="hyper-edge dim-3" x1="380.5" y1="340.5" x2="140.29" y2="440"/>
                <line class="hyper-edge dim-1" x1="620.71" y1="440" x2="720.21" y2="680.21"/>
                <line class="hyper-edge dim-3" x1="620.71" y1="440" x2="380.5" y2="539.5"/>
                <line class="hyper-edge dim-0" x1="480" y1="580.71" x2="720.21" y2="680.21"/>
                <line class="hyper-edge dim-3" x1="480" y1="580.71" x2="239.79" y2="680.21"/>
                <line class="hyper-edge dim-3" x1="720.21" y1="680.21" x2="480" y2="779.71"/>
                <line class="hyper-edge dim-0" x1="239.79" y1="199.79" x2="480" y2="299.29"/>
                <line class="hyper-edge dim-1" x1="239.79" y1="199.79" x2="339.29" y2="440"/>
                <line class="hyper-edge dim-2" x1="239.79" y1="199.79" x2="140.29" y2="440"/>
                <line class="hyper-edge dim-1" x1="480" y1="299.29" x2="579.5" y2="539.5"/>
                <line class="hyper-edge dim-2" x1="480" y1="299.29" x2="380.5" y2="539.5"/>
                <line class="hyper-edge dim-0" x1="339.29" y1="440" x2="579.5" y2="539.5"/>
                <line class="hyper-edge dim-2" x1="339.29" y1="440" x2="239.79" y2="680.21"/>
                <line class="hyper-edge dim-2" x1="579.5" y1="539.5" x2="480" y2="779.71"/>
                <line class="hyper-edge dim-0" x1="140.29" y1="440" x2="380.5" y2="539.5"/>
                <line class="hyper-edge dim-1" x1="140.29" y1="440" x2="239.79" y2="680.21"/>
                <line class="hyper-edge dim-1" x1="380.5" y1="539.5" x2="480" y2="779.71"/>
                <line class="hyper-edge dim-0" x1="239.79" y1="680.21" x2="480" y2="779.71"/>
        </g>

        <!-- Typography -->
        <g text-anchor="middle" transform="translate(480, 800)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace">
            <text x="0" y="0" font-weight="600" font-size="32" fill="#fafafa" letter-spacing="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">samizdat</text>
            <text x="0" y="30" font-weight="400" font-size="12" fill="#52525b" letter-spacing="4">{ LIVE AGENTIC HARNESS }</text>
        </g>
    </g>
</svg>
