<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">

  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121212" />
      <stop offset="100%" stop-color="#1e1e1e" />
    </linearGradient>

    <!-- Ring Gradients -->
    <!-- Kernel Ring (Durable, Deep, Base) -->
    <linearGradient id="kernel-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" /> <!-- Indigo -->
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>

    <!-- Executor Ring (Mycelium, Workflow, Connection) -->
    <linearGradient id="executor-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" /> <!-- Emerald -->
      <stop offset="100%" stop-color="#065F46" />
    </linearGradient>

    <!-- Capabilities Ring (Surface, Plugins, Interactivity) -->
    <linearGradient id="cap-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" /> <!-- Amber -->
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Agent Node Gradients -->
    <linearGradient id="agent-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="agent-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <!-- Subtle Glow Filter for Outer Ring -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Drop shadow for text -->
    <filter id="text-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.6"/>
    </filter>

    <!-- Mycelium Texture/Pattern for Executor Ring -->
    <pattern id="mycelium" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 0,20 Q 10,10 20,20 T 40,20 M 20,0 Q 10,10 20,20 T 20,40" stroke="#10B981" stroke-opacity="0.3" fill="none" stroke-width="1.5" />
    </pattern>

    <!-- Arrow marker for feedback loop -->
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10B981" />
    </marker>
  </defs>

  <!-- Background: rounded box (rx carries over the CSS border-radius: 60px) -->
  <rect width="800" height="800" fill="url(#bg-grad)" rx="60" />

  <!-- Center grouping for rings -->
  <g transform="translate(400, 360)">

    <!-- 3. Capabilities Ring (Outer) -->
    <!-- Broken up into segments to represent plugins/cells -->
    <g stroke="url(#cap-grad)" stroke-width="18" fill="none" stroke-linecap="round" filter="url(#glow)">
      <!-- Top Left -->
      <path d="M -180,-100 A 200 200 0 0 1 -40,-195" />
      <circle cx="-110" cy="-147.5" r="4" fill="#F59E0B" stroke="none" /> <!-- Cell node -->
      <!-- Top Right -->
      <path d="M 40,-195 A 200 200 0 0 1 180,-100" />
      <circle cx="110" cy="-147.5" r="4" fill="#F59E0B" stroke="none" />
      <!-- Right -->
      <path d="M 195,-60 A 200 200 0 0 1 195,60" />
      <circle cx="195" cy="0" r="4" fill="#F59E0B" stroke="none" />
      <!-- Bottom Right -->
      <path d="M 180,100 A 200 200 0 0 1 40,195" />
      <circle cx="110" cy="147.5" r="4" fill="#F59E0B" stroke="none" />
      <!-- Bottom Left -->
      <path d="M -40,195 A 200 200 0 0 1 -180,100" />
      <circle cx="-110" cy="147.5" r="4" fill="#F59E0B" stroke="none" />
      <!-- Left -->
      <path d="M -195,60 A 200 200 0 0 1 -195,-60" />
      <circle cx="-195" cy="0" r="4" fill="#F59E0B" stroke="none" />
    </g>

    <!-- Connection lines between plugins and executor -->
    <g stroke="#F59E0B" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="4 4">
        <line x1="-110" y1="-147.5" x2="-75" y2="-100" />
        <line x1="110" y1="-147.5" x2="75" y2="-100" />
        <line x1="195" y1="0" x2="125" y2="0" />
        <line x1="110" y1="147.5" x2="75" y2="100" />
        <line x1="-110" y1="147.5" x2="-75" y2="100" />
        <line x1="-195" y1="0" x2="-125" y2="0" />
    </g>

    <!-- 2. Executor Ring (Middle - Mycelium/Workflow) -->
    <!-- Base ring -->
    <circle r="125" stroke="url(#executor-grad)" stroke-width="24" fill="none" />
    <!-- Textured overlay representing mycelium workflow network -->
    <circle r="125" stroke="url(#mycelium)" stroke-width="24" fill="none" opacity="0.8" />

    <!-- Self-modifying feedback loop indicator (The manifest rewriting itself) -->
    <path d="M 0,-150 A 150 150 0 0 1 106,-106 L 90,-90" stroke="#10B981" stroke-width="4" fill="none" marker-end="url(#arrow)" stroke-dasharray="6 4" opacity="0.7"/>

    <!-- 1. Kernel Ring (Inner - Durable, Immutable) -->
    <!-- Solid, unbroken core -->
    <circle r="60" fill="url(#kernel-grad)" stroke="#1e1e1e" stroke-width="4"/>

    <!-- Inner geometric structure representing the journal/data store -->
    <g transform="scale(0.8)">
      <polygon points="0,-40 34.6,-20 34.6,20 0,40 -34.6,20 -34.6,-20" fill="none" stroke="#818CF8" stroke-width="3" opacity="0.6"/>
      <line x1="0" y1="-40" x2="0" y2="0" stroke="#818CF8" stroke-width="3" opacity="0.6"/>
      <line x1="34.6" y1="20" x2="0" y2="0" stroke="#818CF8" stroke-width="3" opacity="0.6"/>
      <line x1="-34.6" y1="20" x2="0" y2="0" stroke="#818CF8" stroke-width="3" opacity="0.6"/>
      <!-- Core immutable spark -->
      <circle cx="0" cy="0" r="8" fill="#C7D2FE" />
    </g>

    <!-- Multiple Agents Collaborating -->

    <!-- Agent 1 (Top Left) -->
    <g transform="translate(-140, -110)">
      <circle r="16" fill="url(#agent-grad-1)" />
      <!-- Connection to workspace/executor -->
      <path d="M 12,12 L 40,40" stroke="url(#agent-grad-1)" stroke-width="3" fill="none" opacity="0.8"/>
      <!-- Inner eye/sensor -->
      <circle r="6" fill="#121212" />
      <circle cx="-2" cy="-2" r="2" fill="#fff" />
    </g>

    <!-- Agent 2 (Bottom Right) -->
    <g transform="translate(130, 110)">
      <circle r="14" fill="url(#agent-grad-2)" />
      <!-- Connection to workspace/executor -->
      <path d="M -10,-10 L -30,-30" stroke="url(#agent-grad-2)" stroke-width="3" fill="none" opacity="0.8"/>
      <!-- Inner eye/sensor -->
      <circle r="5" fill="#121212" />
      <circle cx="-2" cy="-2" r="1.5" fill="#fff" />
    </g>

    <!-- Collaborative feature workspace indicator (between agents) -->
    <path d="M -120,-90 Q 0,0 110,90" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="2" fill="none" stroke-dasharray="2 6"/>
  </g>

  <!-- Typography -->
  <g text-anchor="middle" font-family="'Courier New', Courier, monospace, 'Fira Code', 'JetBrains Mono'" filter="url(#text-shadow)">
    <!-- Main Title -->
    <text x="400" y="660" font-size="64" font-weight="bold" fill="#F8FAFC" letter-spacing="4">
      samizdat
    </text>

    <!-- Subtitle / Tagline highlighting Clojure/Scheme roots -->
    <text x="400" y="700" font-size="18" fill="#94A3B8" letter-spacing="2">
      <tspan fill="#38BDF8">(</tspan>AGENTIC HARNESS<tspan fill="#38BDF8">)</tspan>
    </text>

    <!-- Tiny detail text framing the logo (like a manifest/data) -->
    <text x="400" y="730" font-size="12" fill="#475569" letter-spacing="1">
      { :kernel "immutable" :executor "mycelium" :capabilities "plugins" }
    </text>
  </g>

</svg>
